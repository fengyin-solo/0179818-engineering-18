services:
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        # 默认用 package 版本 + 日期，保证每次 build 的 X-App-Version 可区分；
        # CI 发布时会显式传入 BUILD_ID=<version>-<git-sha>
        BUILD_ID: ${BUILD_ID:-local-dev}
    container_name: guqin-audio-analyzer
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
