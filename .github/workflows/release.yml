name: release

# 最小发布流水线：
# - 任何推送 / PR：先跑可重复的发布前校验（页面/样式/脚本、压缩、安全头、缓存、SPA 回退、版本指纹）
# - main 分支：校验通过后构建镜像（验证 Dockerfile 可用，不推送）
# - v* 标签：校验通过后构建并推送镜像到 GHCR，版本号 BUILD_ID=<tag>-<short-sha>
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  release-check:
    name: 发布前校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - working-directory: frontend-user
        run: npm ci
      # 配置漂移检查：serve.config.js 与生成的 nginx.conf 不一致直接失败
      - name: 校验 nginx.conf 已按共享配置生成
        working-directory: frontend-user
        run: npm run check:nginx
      # 可重复的端到端发布门禁（双版本构建 + 真实服务逐项断言）
      - name: 发布校验
        working-directory: frontend-user
        run: npm run release:check

  docker-image:
    name: 构建镜像
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 计算构建版本号
        id: buildid
        run: echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR（仅标签发布）
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=ci-${{ github.run_number }},enable=${{ github.ref_type == 'branch' }}
      - name: 构建（main 只验证；v* 标签推送）
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-user
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            BUILD_ID=${{ steps.buildid.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
