# 由 deploy/generate-nginx.mjs 依据 deploy/serve.config.js 生成，请勿手改
server {
    listen 8081;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css text/html text/xml application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Vite 指纹产物（文件名带内容 hash）：长缓存
    # X-App-Version 随镜像构建注入，发布后响应头随之变化，可据此确认版本生效
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-App-Version "__BUILD_ID__" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # public/ 中的静态资源（文件名不带 hash）：短缓存，需重新验证
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav|ogg)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-App-Version "__BUILD_ID__" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 路由回退 + 入口 HTML 不缓存
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-App-Version "__BUILD_ID__" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
